<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>استقبال المدعوين | رنيم وأحمد</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f8f4ed;

      text-align: center;

      padding: 40px 15px;

      color: #59472d;

    }

    .card {

      background: white;

      max-width: 420px;

      margin: auto;

      padding: 30px 20px;

      border-radius: 20px;

    }

    h1 { color: #a7864e; }

  </style>

</head>

<body>

  <div class="card">

    <h1>💍 Raneem & Ahmed</h1>

    <h2>بوابة استقبال المدعوين</h2>

    <p>جاري تجهيز نظام مسح الدعوات 🤍</p>

  </div>
<button onclick="testCamera()" style="margin-top:20px;padding:15px;background:#a7864e;color:white;border:0;border-radius:10px;font-size:18px;">

  📷 اختبار الكاميرا

</button>

<p id="cameraStatus"></p>

<video id="cameraPreview" autoplay playsinline muted

       style="width:100%;max-width:350px;border-radius:12px;"></video>

<script>

async function testCamera() {

  const status = document.getElementById('cameraStatus');

  try {

    status.textContent = 'جاري تشغيل الكاميرا...';

    const stream = await navigator.mediaDevices.getUserMedia({

      video: { facingMode: 'environment' },

      audio: false

    });

    document.getElementById('cameraPreview').srcObject = stream;

    status.textContent = '🟢 الكاميرا اشتغلت بنجاح!';

  } catch (error) {

    status.textContent = '🔴 ' + (error.message || String(error));

  }

}

</script>
</body>

</html>
