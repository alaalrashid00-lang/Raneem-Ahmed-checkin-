<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>استقبال المدعوين | رنيم وأحمد</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f8f4ed;

      text-align: center;

      padding: 40px 15px;

      color: #59472d;

    }

    .card {

      background: white;

      max-width: 420px;

      margin: auto;

      padding: 30px 20px;

      border-radius: 20px;

    }

    h1 { color: #a7864e; }

  </style>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>

  <div class="card">

    <h1>💍 Raneem & Ahmed</h1>

    <h2>بوابة استقبال المدعوين</h2>

    <p>جاري تجهيز نظام مسح الدعوات 🤍</p>

  </div>
<button onclick="scanInvitation()" style="margin-top:20px;padding:15px;background:#a7864e;color:white;border:0;border-radius:10px;font-size:18px;">

  📷 اختبار الكاميرا

</button>

<p id="cameraStatus"></p>

<div id="reader" style="width:100%;max-width:350px;margin:20px auto;"></div>

<script>

async function testCamera() {

  const status = document.getElementById('cameraStatus');

  try {

    status.textContent = 'جاري تشغيل الكاميرا...';

    const stream = await navigator.mediaDevices.getUserMedia({

      video: { facingMode: 'environment' },

      audio: false

    });

    document.getElementById('cameraPreview').srcObject = stream;

    status.textContent = '🟢 الكاميرا اشتغلت بنجاح!';

  } catch (error) {

    status.textContent = '🔴 ' + (error.message || String(error));

  }

}
async function scanInvitation() {

  const status = document.getElementById('cameraStatus');

  try {

    status.textContent = '📷 جاري تشغيل قارئ الباركود...';

    const scanner = new Html5Qrcode('reader');

    await scanner.start(

      { facingMode: 'environment' },

      { fps: 10, qrbox: 230 },

      async function(qrText) {

        await scanner.stop();

        status.textContent = '🟢 تمت قراءة الباركود بنجاح';

        const invitationUrl = new URL(qrText);

const token = invitationUrl.searchParams.get('token');

if (!token) {

  status.textContent = '🔴 باركود الدعوة غير صالح';

  return;

}

status.textContent = '🟡 تم قراءة الدعوة، وجاري التحقق منها';

      },

      function() {}

    );

    status.textContent = '📷 وجّهي الكاميرا إلى باركود الدعوة';

  } catch (error) {

    status.textContent = '🔴 تعذر تشغيل القارئ: ' + error;

  }

}

  
</script>
</body>

</html>
